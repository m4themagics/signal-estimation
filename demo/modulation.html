<title>Модуляция — песочница сигналов</title>
<style>
  :root{
    --paper:#F5F8FA;
    --panel:#FDFEFF;
    --grid:#DCE7EF;
    --grid-major:#C2D4E1;
    --ink:#1B3A57;
    --muted:#5B7286;
    --line:#C4D3DE;
    --trace:#16436B;      /* результат */
    --trace2:#B3452E;     /* модулятор */
    --trace3:#8FA9BC;     /* несущая (призрак) */
    --accent:#B3452E;
    --accent-ink:#FDFEFF;
    --dot:#B3452E;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0B141E;
      --panel:#101C29;
      --grid:#16283A;
      --grid-major:#20374E;
      --ink:#D9E5EF;
      --muted:#7E93A6;
      --line:#243A4F;
      --trace:#67C7E0;
      --trace2:#F0A15C;
      --trace3:#3E5C74;
      --accent:#F0A15C;
      --accent-ink:#0B141E;
      --dot:#F0A15C;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B141E; --panel:#101C29; --grid:#16283A; --grid-major:#20374E;
    --ink:#D9E5EF; --muted:#7E93A6; --line:#243A4F;
    --trace:#67C7E0; --trace2:#F0A15C; --trace3:#3E5C74;
    --accent:#F0A15C; --accent-ink:#0B141E; --dot:#F0A15C;
  }
  :root[data-theme="light"]{
    --paper:#F5F8FA; --panel:#FDFEFF; --grid:#DCE7EF; --grid-major:#C2D4E1;
    --ink:#1B3A57; --muted:#5B7286; --line:#C4D3DE;
    --trace:#16436B; --trace2:#B3452E; --trace3:#8FA9BC;
    --accent:#B3452E; --accent-ink:#FDFEFF; --dot:#B3452E;
  }

  html{background:var(--paper);}
  body{
    font-family: Georgia, 'Times New Roman', serif;
    color:var(--ink);
    background:var(--paper);
    line-height:1.55;
  }
  .wrap{max-width:880px; margin:0 auto; padding:40px 20px 72px;}

  .eyebrow{
    font-family:'SF Mono', Menlo, Consolas, monospace;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--muted);
  }
  h1{
    font-size:clamp(34px, 6vw, 52px);
    font-weight:400; letter-spacing:-.01em;
    margin:6px 0 10px; text-wrap:balance;
  }
  .lede{max-width:62ch; color:var(--muted); font-size:17px; margin:0 0 28px;}
  .lede em{color:var(--ink);}

  /* табы режимов */
  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .tab{
    font-family:'SF Mono', Menlo, Consolas, monospace;
    font-size:12.5px; letter-spacing:.06em;
    padding:8px 14px; cursor:pointer;
    background:transparent; color:var(--muted);
    border:1px solid var(--line); border-radius:3px;
  }
  .tab:hover{color:var(--ink); border-color:var(--muted);}
  .tab[aria-selected="true"]{
    background:var(--ink); color:var(--paper); border-color:var(--ink);
  }
  .tab:focus-visible, .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* осциллограф */
  .scope{
    border:1px solid var(--line); border-radius:4px;
    background:var(--panel); overflow:hidden;
  }
  .scope-head{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:12px; flex-wrap:wrap;
    padding:12px 16px; border-bottom:1px solid var(--line);
  }
  .formula{
    font-family:'SF Mono', Menlo, Consolas, monospace;
    font-size:13px; color:var(--ink);
  }
  .formula sub{font-size:9px;}
  .legend{display:flex; gap:14px; flex-wrap:wrap;}
  .chip{
    font-family:'SF Mono', Menlo, Consolas, monospace;
    font-size:11px; color:var(--muted);
    display:flex; align-items:center; gap:6px;
  }
  .swatch{width:18px; height:0; border-top:2.5px solid;}
  .swatch.dashed{border-top-style:dashed;}
  canvas{display:block; width:100%; height:340px;}

  /* пульт */
  .controls{
    margin-top:18px;
    display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;
  }
  @media (max-width:640px){ .controls{grid-template-columns:1fr;} }
  .ctl{
    background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:14px 16px 16px;
  }
  .ctl-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .ctl-label{
    font-family:'SF Mono', Menlo, Consolas, monospace;
    font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted);
  }
  .ctl-label sub{text-transform:none;}
  .ctl-val{
    font-family:'SF Mono', Menlo, Consolas, monospace;
    font-size:14px; color:var(--ink); font-variant-numeric:tabular-nums;
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:24px; background:transparent; cursor:pointer; margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px; background:var(--line);}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:16px; height:16px; border-radius:50%;
    background:var(--accent); border:none; margin-top:-7px;
  }
  input[type=range]::-moz-range-track{height:2px; background:var(--line);}
  input[type=range]::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%;
    background:var(--accent); border:none;
  }
  input[type=range]:focus-visible{outline:2px solid var(--accent); outline-offset:4px; border-radius:3px;}

  .bar{margin-top:14px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .btn{
    font-family:'SF Mono', Menlo, Consolas, monospace;
    font-size:13px; letter-spacing:.04em;
    padding:10px 18px; cursor:pointer; border-radius:3px;
    background:var(--accent); color:var(--accent-ink);
    border:1px solid var(--accent);
  }
  .btn[aria-pressed="true"]{background:transparent; color:var(--accent);}
  .hint{font-size:13.5px; color:var(--muted); font-style:italic;}

  .note{
    margin-top:26px; padding-top:18px; border-top:1px solid var(--line);
    max-width:68ch; font-size:15.5px; color:var(--muted);
  }
  .note b{color:var(--ink); font-weight:600;}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">сигналы · гармонический анализ · лист 1</div>
    <h1>Модуляция</h1>
    <p class="lede">Одна синусоида управляет другой. <em>Несущая</em> звучит, <em>модулятор</em> дирижирует — а что именно он меняет (амплитуду, частоту или сам сигнал целиком), выбираете вы. Крутите ручки, потом нажмите «Послушать».</p>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="scope">
    <div class="scope-head">
      <div class="formula" id="formula"></div>
      <div class="legend" id="legend"></div>
    </div>
    <canvas id="cv" aria-label="Осциллограф: график сигнала"></canvas>
  </div>

  <div class="controls" id="controls"></div>

  <div class="bar">
    <button class="btn" id="soundBtn" aria-pressed="false">▶ Послушать</button>
    <span class="hint">звук тихий, но начните с малой громкости</span>
  </div>

  <p class="note" id="note"></p>
</div>

<script>
(function(){
  'use strict';
  const TAU = Math.PI * 2;
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

  /* ---------- режимы ---------- */
  const MODES = {
    am: {
      title: 'АМ',
      formula: 'y(t) = [1 + m·sin(2πf<sub>м</sub>t)] · sin(2πf<sub>н</sub>t)',
      legend: [['trace3','несущая'],['trace2','модулятор', true],['trace','результат']],
      note: '<b>Амплитудная модуляция.</b> Громкость несущей послушно следует за модулятором — пунктирная огибающая и есть его копия. Именно так передаёт голос АМ-радио на длинных и средних волнах: медленный звуковой сигнал «вписан» в амплитуду быстрой радиоволны.',
      params: [
        {key:'fc', label:'несущая f<sub>н</sub>', min:2,  max:24, step:0.1,  val:9,   unit:'Гц', dec:1},
        {key:'fm', label:'модулятор f<sub>м</sub>', min:0.2,max:6,  step:0.05, val:1.2, unit:'Гц', dec:2},
        {key:'m',  label:'глубина m',  min:0,  max:1,  step:0.01, val:0.7, unit:'',   dec:2}
      ]
    },
    fm: {
      title: 'ЧМ',
      formula: 'y(t) = sin(2πf<sub>н</sub>t + I·sin(2πf<sub>м</sub>t))',
      legend: [['trace3','несущая'],['trace2','модулятор', true],['trace','результат']],
      note: '<b>Частотная модуляция.</b> Теперь модулятор раскачивает не громкость, а частоту: волна то сжимается, то растягивается. На этом принципе работает FM-радио, а при звуковых частотах модулятора — легендарный синтезатор Yamaha DX7: почти все «стеклянные» тембры 80-х сделаны ровно этой формулой.',
      params: [
        {key:'fc', label:'несущая f<sub>н</sub>', min:2,  max:24, step:0.1,  val:8,   unit:'Гц', dec:1},
        {key:'fm', label:'модулятор f<sub>м</sub>', min:0.2,max:6,  step:0.05, val:1,   unit:'Гц', dec:2},
        {key:'I',  label:'индекс I',   min:0,  max:12, step:0.1,  val:4,   unit:'',   dec:1}
      ]
    },
    ring: {
      title: 'Кольцевая',
      formula: 'y(t) = sin(2πf<sub>м</sub>t) · sin(2πf<sub>н</sub>t)',
      legend: [['trace3','несущая'],['trace2','модулятор', true],['trace','результат']],
      note: '<b>Кольцевая модуляция</b> — честное перемножение двух сигналов. По формуле произведения синусов исходные частоты исчезают, а вместо них рождаются сумма и разность: f<sub>н</sub>±f<sub>м</sub>. Звучит металлически и нечеловечески — именно так сделан голос далеков в «Докторе Кто».',
      params: [
        {key:'fc',  label:'несущая f<sub>н</sub>', min:2,  max:24, step:0.1,  val:12,  unit:'Гц', dec:1},
        {key:'fm',  label:'модулятор f<sub>м</sub>', min:0.2,max:8,  step:0.05, val:2,   unit:'Гц', dec:2},
        {key:'mix', label:'баланс',     min:0,  max:1,  step:0.01, val:1,   unit:'',   dec:2}
      ]
    },
    liss: {
      title: 'Лиссажу',
      formula: 'x = sin(a·t + δ) &nbsp; y = sin(b·t)',
      legend: [['trace','кривая'],['trace2','точка (t)']],
      note: '<b>Фигуры Лиссажу</b> — две синусоиды, поданные на перпендикулярные оси осциллографа. При целочисленном отношении частот a:b кривая замыкается; сдвиг фазы δ поворачивает и «раскрывает» её. Так до эпохи цифровых частотомеров сверяли частоты генераторов: увидел устойчивую восьмёрку — значит, ровно 2:1.',
      params: [
        {key:'a', label:'частота a',  min:1, max:12, step:1,    val:3,    unit:'', dec:0},
        {key:'b', label:'частота b',  min:1, max:12, step:1,    val:2,    unit:'', dec:0},
        {key:'d', label:'сдвиг δ',    min:0, max:3.14, step:0.01, val:1.57, unit:'рад', dec:2}
      ]
    }
  };
  const ORDER = ['am','fm','ring','liss'];
  let mode = 'am';
  const P = {}; // текущие значения: P[mode][key]
  for (const k of ORDER){ P[k] = {}; MODES[k].params.forEach(p => P[k][p.key] = p.val); }

  /* ---------- ui: табы, легенда, слайдеры ---------- */
  const tabsEl = $('tabs');
  ORDER.forEach(k => {
    const b = document.createElement('button');
    b.className = 'tab'; b.textContent = MODES[k].title;
    b.setAttribute('role','tab');
    b.addEventListener('click', () => setMode(k));
    b.dataset.mode = k;
    tabsEl.appendChild(b);
  });

  function setMode(k){
    mode = k;
    for (const t of tabsEl.children) t.setAttribute('aria-selected', t.dataset.mode === k);
    $('formula').innerHTML = MODES[k].formula;
    $('note').innerHTML = MODES[k].note;
    const css = getComputedStyle(document.documentElement);
    $('legend').innerHTML = MODES[k].legend.map(([varName, name, dashed]) =>
      `<span class="chip"><span class="swatch${dashed ? ' dashed' : ''}" style="border-top-color:var(--${varName})"></span>${name}</span>`
    ).join('');
    buildSliders();
    if (audio.playing) audio.rebuild();
    drawOnce();
  }

  function buildSliders(){
    const c = $('controls');
    c.innerHTML = '';
    MODES[mode].params.forEach(p => {
      const box = document.createElement('div');
      box.className = 'ctl';
      box.innerHTML =
        `<div class="ctl-row"><span class="ctl-label">${p.label}</span>` +
        `<span class="ctl-val" id="val-${p.key}"></span></div>`;
      const r = document.createElement('input');
      r.type = 'range'; r.min = p.min; r.max = p.max; r.step = p.step;
      r.value = P[mode][p.key];
      r.setAttribute('aria-label', p.label.replace(/<[^>]+>/g,''));
      r.addEventListener('input', () => {
        P[mode][p.key] = parseFloat(r.value);
        showVal(p);
        audio.update();
        drawOnce();
      });
      box.appendChild(r);
      c.appendChild(box);
      showVal(p);
    });
  }
  function showVal(p){
    const v = P[mode][p.key];
    $('val-' + p.key).textContent = v.toFixed(p.dec) + (p.unit ? ' ' + p.unit : '');
  }

  /* ---------- математика ---------- */
  function modulator(t){
    const p = P[mode];
    return Math.sin(TAU * p.fm * t);
  }
  function carrier(t){
    const p = P[mode];
    return Math.sin(TAU * p.fc * t);
  }
  function result(t){
    const p = P[mode];
    if (mode === 'am')  return (1 + p.m * Math.sin(TAU*p.fm*t)) * Math.sin(TAU*p.fc*t) / (1 + p.m);
    if (mode === 'fm')  return Math.sin(TAU*p.fc*t + p.I * Math.sin(TAU*p.fm*t));
    if (mode === 'ring'){
      const dry = Math.sin(TAU*p.fc*t);
      return (1 - p.mix) * dry + p.mix * dry * Math.sin(TAU*p.fm*t);
    }
    return 0;
  }

  /* ---------- осциллограф ---------- */
  const cv = $('cv');
  const ctx2d = cv.getContext('2d');
  let W = 0, H = 0, tShift = 0, lastTs = 0;

  function resize(){
    const dpr = devicePixelRatio || 1;
    const rect = cv.getBoundingClientRect();
    W = rect.width; H = rect.height;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawOnce();
  }
  new ResizeObserver(resize).observe(cv);

  function colors(){
    const s = getComputedStyle(document.documentElement);
    return {
      grid: s.getPropertyValue('--grid').trim(),
      gridMajor: s.getPropertyValue('--grid-major').trim(),
      trace: s.getPropertyValue('--trace').trim(),
      trace2: s.getPropertyValue('--trace2').trim(),
      trace3: s.getPropertyValue('--trace3').trim(),
      dot: s.getPropertyValue('--dot').trim()
    };
  }

  function drawGrid(c){
    const minor = 12, major = 60;
    ctx2d.lineWidth = 1;
    for (let x = 0.5; x < W; x += minor){
      ctx2d.strokeStyle = (Math.round(x - 0.5) % major === 0) ? c.gridMajor : c.grid;
      ctx2d.beginPath(); ctx2d.moveTo(x, 0); ctx2d.lineTo(x, H); ctx2d.stroke();
    }
    for (let y = 0.5; y < H; y += minor){
      ctx2d.strokeStyle = (Math.round(y - 0.5) % major === 0) ? c.gridMajor : c.grid;
      ctx2d.beginPath(); ctx2d.moveTo(0, y); ctx2d.lineTo(W, y); ctx2d.stroke();
    }
  }

  function plotWave(fn, color, width, dash, amp){
    const N = 700, T = 1.0, mid = H / 2, A = amp * (H / 2 - 24);
    ctx2d.strokeStyle = color; ctx2d.lineWidth = width;
    ctx2d.setLineDash(dash || []);
    ctx2d.beginPath();
    for (let i = 0; i <= N; i++){
      const x = (i / N) * W;
      const y = mid - fn(tShift + (i / N) * T) * A;
      i ? ctx2d.lineTo(x, y) : ctx2d.moveTo(x, y);
    }
    ctx2d.stroke();
    ctx2d.setLineDash([]);
  }

  function draw(){
    const c = colors();
    ctx2d.clearRect(0, 0, W, H);
    drawGrid(c);

    if (mode === 'liss'){
      const p = P[mode];
      const cx = W / 2, cy = H / 2, A = Math.min(W, H) / 2 - 30;
      const N = 1600;
      ctx2d.strokeStyle = c.trace; ctx2d.lineWidth = 2;
      ctx2d.beginPath();
      for (let i = 0; i <= N; i++){
        const th = (i / N) * TAU;
        const x = cx + Math.sin(p.a * th + p.d) * A;
        const y = cy - Math.sin(p.b * th) * A;
        i ? ctx2d.lineTo(x, y) : ctx2d.moveTo(x, y);
      }
      ctx2d.stroke();
      // бегущая точка
      const th = (tShift * 0.7) % TAU;
      const x = cx + Math.sin(p.a * th + p.d) * A;
      const y = cy - Math.sin(p.b * th) * A;
      ctx2d.fillStyle = c.dot;
      ctx2d.beginPath(); ctx2d.arc(x, y, 5, 0, TAU); ctx2d.fill();
      return;
    }

    plotWave(carrier, c.trace3, 1, [], 0.9);
    plotWave(modulator, c.trace2, 1.5, [6, 5], 0.9);
    if (mode === 'am'){
      const p = P[mode];
      const env = t => (1 + p.m * Math.sin(TAU*p.fm*t)) / (1 + p.m);
      plotWave(env, c.trace2, 1, [2, 4], 0.9);
      plotWave(t => -env(t), c.trace2, 1, [2, 4], 0.9);
    }
    plotWave(result, c.trace, 2.2, [], 0.9);
  }

  function drawOnce(){ if (W) draw(); }

  function loop(ts){
    if (!lastTs) lastTs = ts;
    const dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    tShift += dt * (mode === 'liss' ? 1 : 0.12);
    draw();
    rafId = requestAnimationFrame(loop);
  }
  let rafId = null;
  function setMotion(){
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
    lastTs = 0;
    if (!reduceMotion.matches) rafId = requestAnimationFrame(loop);
    else drawOnce();
  }
  reduceMotion.addEventListener('change', setMotion);

  // перерисовка при смене темы
  new MutationObserver(drawOnce).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(drawOnce, 30));

  /* ---------- звук ---------- */
  const audio = {
    ctx: null, master: null, nodes: null, playing: false,
    ensure(){
      if (!this.ctx){
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0;
        this.master.connect(this.ctx.destination);
      }
    },
    osc(freq){
      const o = this.ctx.createOscillator();
      o.type = 'sine'; o.frequency.value = freq; o.start();
      return o;
    },
    gain(v){ const g = this.ctx.createGain(); g.gain.value = v; return g; },
    teardown(){
      if (!this.nodes) return;
      this.nodes.all.forEach(n => { try { n.disconnect(); } catch(e){} try { n.stop && n.stop(); } catch(e){} });
      this.nodes = null;
    },
    rebuild(){
      this.teardown();
      const p = P[mode], n = {};
      if (mode === 'am'){
        n.car = this.osc(this.fcHz(p.fc));
        n.amp = this.gain(0.5);
        n.lfo = this.osc(p.fm * 2);
        n.lfoG = this.gain(p.m * 0.45);
        n.lfo.connect(n.lfoG); n.lfoG.connect(n.amp.gain);
        n.car.connect(n.amp); n.amp.connect(this.master);
        n.all = [n.car, n.amp, n.lfo, n.lfoG];
      } else if (mode === 'fm'){
        n.car = this.osc(this.fcHz(p.fc));
        n.mod = this.osc(this.fmHz(p.fm));
        n.dev = this.gain(p.I * this.fmHz(p.fm) * 0.6);
        n.out = this.gain(0.5);
        n.mod.connect(n.dev); n.dev.connect(n.car.frequency);
        n.car.connect(n.out); n.out.connect(this.master);
        n.all = [n.car, n.mod, n.dev, n.out];
      } else if (mode === 'ring'){
        n.car = this.osc(this.fcHz(p.fc));
        n.mod = this.osc(this.fmHz(p.fm));
        n.wet = this.gain(0);
        n.wetOut = this.gain(p.mix * 0.5);
        n.dry = this.gain((1 - p.mix) * 0.5);
        n.mod.connect(n.wet.gain);
        n.car.connect(n.wet); n.wet.connect(n.wetOut); n.wetOut.connect(this.master);
        n.car.connect(n.dry); n.dry.connect(this.master);
        n.all = [n.car, n.mod, n.wet, n.wetOut, n.dry];
      } else { // лиссажу — два тона в отношении a:b
        n.oa = this.osc(110 * p.a);
        n.ob = this.osc(110 * p.b);
        n.ga = this.gain(0.25); n.gb = this.gain(0.25);
        n.oa.connect(n.ga); n.ga.connect(this.master);
        n.ob.connect(n.gb); n.gb.connect(this.master);
        n.all = [n.oa, n.ob, n.ga, n.gb];
      }
      this.nodes = n;
    },
    fcHz(fc){ return 160 + fc * 14; },   // 2–24 → 188–496 Гц
    fmHz(fm){ return fm * 32; },         // 0.2–8 → 6–256 Гц
    update(){
      if (!this.playing || !this.nodes) return;
      const p = P[mode], n = this.nodes, t = this.ctx.currentTime, s = 0.03;
      const set = (param, v) => param.setTargetAtTime(v, t, s);
      if (mode === 'am'){
        set(n.car.frequency, this.fcHz(p.fc));
        set(n.lfo.frequency, p.fm * 2);
        set(n.lfoG.gain, p.m * 0.45);
      } else if (mode === 'fm'){
        set(n.car.frequency, this.fcHz(p.fc));
        set(n.mod.frequency, this.fmHz(p.fm));
        set(n.dev.gain, p.I * this.fmHz(p.fm) * 0.6);
      } else if (mode === 'ring'){
        set(n.car.frequency, this.fcHz(p.fc));
        set(n.mod.frequency, this.fmHz(p.fm));
        set(n.wetOut.gain, p.mix * 0.5);
        set(n.dry.gain, (1 - p.mix) * 0.5);
      } else {
        set(n.oa.frequency, 110 * p.a);
        set(n.ob.frequency, 110 * p.b);
      }
    },
    toggle(){
      this.ensure();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      const t = this.ctx.currentTime;
      if (!this.playing){
        this.rebuild();
        this.master.gain.cancelScheduledValues(t);
        this.master.gain.setTargetAtTime(0.12, t, 0.05);
        this.playing = true;
      } else {
        this.master.gain.cancelScheduledValues(t);
        this.master.gain.setTargetAtTime(0, t, 0.05);
        this.playing = false;
        setTimeout(() => { if (!this.playing) this.teardown(); }, 400);
      }
    }
  };

  const soundBtn = $('soundBtn');
  soundBtn.addEventListener('click', () => {
    audio.toggle();
    soundBtn.setAttribute('aria-pressed', audio.playing);
    soundBtn.textContent = audio.playing ? '■ Тишина' : '▶ Послушать';
  });

  /* ---------- старт ---------- */
  setMode('am');
  resize();
  setMotion();
})();
</script>
